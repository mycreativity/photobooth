---
# ============================================================
# Photobooth — Quick Deploy Playbook
# ============================================================
# Syncs code and restarts the service. ~10 seconds.
#
# Usage:
#   cd apps/booth/ansible
#   ansible-playbook deploy.yml
# ============================================================

- name: Deploy photobooth
  hosts: photobooth
  become: true

  vars:
    app_dir: /opt/photobooth
    venv_dir: /opt/photobooth/.venv
    booth_user: photobooth
    booth_group: photobooth
    local_repo: "{{ playbook_dir }}/.."
    repo_root: "{{ playbook_dir }}/../../.."

  tasks:
    - name: Sync app code
      ansible.builtin.synchronize:
        src: "{{ local_repo }}/"
        dest: "{{ app_dir }}/"
        delete: false
        rsync_opts:
          - "--exclude=.venv"
          - "--exclude=.git"
          - "--exclude=__pycache__"
          - "--exclude=.pytest_cache"
          - "--exclude=photos"
          - "--exclude=photobooth.db"
          - "--exclude=.kivy"
          - "--exclude=ansible"
          - "--exclude=booth.toml"   # Device-local config (holds API key) — never overwrite
      become: false

    - name: Sync shared package
      ansible.builtin.synchronize:
        src: "{{ repo_root }}/packages/shared/"
        dest: "{{ app_dir }}/shared/"
        delete: true
        rsync_opts:
          - "--exclude=__pycache__"
      become: false

    - name: Fix file ownership
      ansible.builtin.file:
        path: "{{ app_dir }}"
        owner: "{{ booth_user }}"
        group: "{{ booth_group }}"
        recurse: true

    - name: Reinstall package (pick up new deps)
      ansible.builtin.command:
        cmd: "{{ venv_dir }}/bin/pip install -e {{ app_dir }}"
      become: true
      become_user: "{{ booth_user }}"
      register: pip_result
      changed_when: "'Successfully installed' in pip_result.stdout"

    # The kiosk runs via the X11 autologin session (.xinitrc), NOT systemd.
    # Make sure the systemd unit can never start a second, competing instance.
    - name: Ensure systemd photobooth service is stopped and disabled
      ansible.builtin.systemd:
        name: photobooth
        state: stopped
        enabled: false
      ignore_errors: true

    # Restart the kiosk by killing the running app — the getty autologin
    # session re-runs .xinitrc and relaunches it with the new code.
    # rc 0 = killed, rc 1 = nothing was running (both fine).
    - name: Restart kiosk app (xinit relaunches it)
      ansible.builtin.command:
        cmd: pkill -f 'bin/python -m photobooth'
      register: kiosk_kill
      changed_when: kiosk_kill.rc == 0
      failed_when: kiosk_kill.rc not in [0, 1]
