---
# ============================================================
# Photobooth — Quick Deploy Playbook
# ============================================================
# Syncs code and restarts the service. ~10 seconds.
#
# Usage:
#   cd apps/booth/ansible
#   ansible-playbook deploy.yml
# ============================================================

- name: Deploy photobooth
  hosts: photobooth
  become: true

  vars:
    app_dir: /opt/photobooth
    venv_dir: /opt/photobooth/.venv
    booth_user: photobooth
    booth_group: photobooth
    local_repo: "{{ playbook_dir }}/.."
    repo_root: "{{ playbook_dir }}/../../.."

  tasks:
    - name: Sync app code
      ansible.builtin.synchronize:
        src: "{{ local_repo }}/"
        dest: "{{ app_dir }}/"
        delete: false
        rsync_opts:
          - "--exclude=.venv"
          - "--exclude=.git"
          - "--exclude=__pycache__"
          - "--exclude=.pytest_cache"
          - "--exclude=photos"
          - "--exclude=photobooth.db"
          - "--exclude=.kivy"
          - "--exclude=ansible"
          - "--exclude=booth.toml"   # Device-local config (holds API key) — never overwrite
      become: false

    - name: Sync shared package
      ansible.builtin.synchronize:
        src: "{{ repo_root }}/packages/shared/"
        dest: "{{ app_dir }}/shared/"
        delete: true
        rsync_opts:
          - "--exclude=__pycache__"
      become: false

    - name: Fix file ownership
      ansible.builtin.file:
        path: "{{ app_dir }}"
        owner: "{{ booth_user }}"
        group: "{{ booth_group }}"
        recurse: true

    - name: Reinstall package (pick up new deps)
      ansible.builtin.command:
        cmd: "{{ venv_dir }}/bin/pip install -e {{ app_dir }}"
      become: true
      become_user: "{{ booth_user }}"
      register: pip_result
      changed_when: "'Successfully installed' in pip_result.stdout"

    - name: Restart photobooth service
      ansible.builtin.systemd:
        name: photobooth
        state: restarted
